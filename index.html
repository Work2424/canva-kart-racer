<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Cube Avoider</title>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-border: rgba(255,255,255,0.12);
      --text: #e5edf8;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --danger: #ef4444;
      --good: #34d399;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #0f172a 0%, #020817 55%, #01050b 100%);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel {
      position: absolute;
      top: 18px;
      left: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 140px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .panel.right {
      left: auto;
      right: 18px;
      min-width: 170px;
      text-align: right;
    }

    .label {
      display: block;
      font-size: 10px;
      opacity: 0.8;
    }

    .value {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      line-height: 1;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 18px 26px;
      text-align: center;
      min-width: 240px;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }

    #message.show {
      opacity: 1;
    }

    #message h2 {
      margin: 0 0 12px 0;
      font-size: 26px;
      color: var(--text);
    }

    #message button {
      pointer-events: auto;
      border: none;
      outline: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(139, 92, 246, 0.35);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <span class="label">Score</span>
      <span id="score" class="value">0</span>
    </div>

    <div class="panel right">
      <span class="label">Best</span>
      <span id="best" class="value">0</span>
    </div>

    <div id="message">
      <h2>Game Over</h2>
      <button id="restartBtn">Restart</button>
    </div>
  </div>

  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020817);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 5, 16);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(6, 10, 8);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.95, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.3;
    scene.add(floor);

    const starGeo = new THREE.BufferGeometry();
    const starCount = 250;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 200;
      starPositions[i + 1] = (Math.random() - 0.5) * 80 + 10;
      starPositions[i + 2] = (Math.random() - 0.5) * 200;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })
    );
    scene.add(stars);

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const message = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let best = Number(localStorage.getItem('cubeBest') || 0);
    bestEl.textContent = String(best);

    const player = new THREE.Group();
    const playerBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x4c1d95, emissiveIntensity: 0.35 })
    );
    player.add(playerBody);
    player.position.set(0, 0, 0);
    scene.add(player);

    const playerBounds = { left: -8, right: 8, top: 3.5, bottom: -3.5 };
    let playerVelocityX = 0;
    let inputX = 0;

    const obstacles = [];
    let gameOver = false;
    let lastTime = 0;

    function resetGame() {
      gameOver = false;
      score = 0;
      scoreEl.textContent = '0';
      message.classList.remove('show');
      player.position.x = 0;
      player.position.y = 0;
      player.position.z = 0;
      while (obstacles.length) {
        scene.remove(obstacles.pop());
      }
    }

    function createObstacle() {
      const side = Math.random() < 0.5 ? 1 : -1;
      const x = (Math.random() * 10 - 5) * side;
      const y = (Math.random() * 6 - 3);
      const z = -60 - Math.random() * 30;

      const obstacle = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 1.8, 1.8),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6),
          emissive: 0x220000,
          emissiveIntensity: 0.3
        })
      );
      obstacle.position.set(x, y, z);
      scene.add(obstacle);
      obstacles.push(obstacle);
    }

    function onKeyChange(event, pressed) {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') inputX = pressed ? -1 : 0;
      if (key === 'arrowright' || key === 'd') inputX = pressed ? 1 : 0;
      if (pressed && (key === ' ' || key === 'spacebar' || event.code === 'Space')) {
        if (gameOver) resetGame();
      }
    }

    window.addEventListener('keydown', (event) => onKeyChange(event, true));
    window.addEventListener('keyup', (event) => onKeyChange(event, false));

    restartBtn.addEventListener('click', resetGame);

    function updatePlayer(dt) {
      if (gameOver) return;
      playerVelocityX = THREE.MathUtils.lerp(playerVelocityX, inputX * 8, 0.12);
      player.position.x += playerVelocityX * dt;
      player.position.x = THREE.MathUtils.clamp(player.position.x, playerBounds.left, playerBounds.right);
      player.rotation.y = playerVelocityX * 0.3;
    }

    function updateObstacles(dt) {
      if (gameOver) return;

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += 18 * dt;

        if (obs.position.z > 18) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem('cubeBest', String(best));
          }
        }
      }

      if (Math.random() < 0.035) {
        createObstacle();
      }

      for (const obs of obstacles) {
        const dx = Math.abs(obs.position.x - player.position.x);
        const dy = Math.abs(obs.position.y - player.position.y);
        const dz = Math.abs(obs.position.z - player.position.z);
        if (dx < 1.4 && dy < 1.4 && dz < 1.4) {
          gameOver = true;
          message.classList.add('show');
        }
      }
    }

    function animate(ts) {
      const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.04);
      lastTime = ts;

      updatePlayer(dt);
      updateObstacles(dt);
      stars.rotation.y += 0.0008;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x * 0.5, 0.08);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3.5 + player.position.y * 0.1, 0.08);
      camera.lookAt(player.position.x, player.position.y, 0);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
